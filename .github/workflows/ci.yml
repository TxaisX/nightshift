name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      # Why: native modules are rebuilt from source and are not needed to
      # typecheck or run the unit suite, so skip them and keep CI fast.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Typecheck
        run: node config/scripts/run-typecheck-projects-in-parallel.mjs

      - name: Lint
        run: pnpm exec oxlint

      - name: Unit tests
        run: pnpm exec vitest run --config config/vitest.config.ts
